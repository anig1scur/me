    <script>
        const lang = navigator.language || '';
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
        const inCN = /^zh-CN/i.test(lang) || tz.includes('Shanghai') || tz.includes('Beijing');

        const base = inCN
            ? 'https://gcore.jsdelivr.net/gh/anig1scur/me@slave/'
            : './';

        function rewriteCDN (el) {
            const attrs = ["src", "href"];
            attrs.forEach(attr => {
                if (el.hasAttribute(attr)) {
                    const val = el.getAttribute(attr);
                    if (val.startsWith("./") || val.startsWith("assets") || val.startsWith("js")) {
                        el.setAttribute(attr, base + val.replace(/^.\//, ""));
                    }
                }
            });
        }

        function rewriteContainerCDN (container = document) {
            if (base === './') {
                return;
            }
            const selectors = ["img[src]", "video[src]", "source[src]", "link[href]", "script[src]"];
            container.querySelectorAll(selectors.join(",")).forEach(el => rewriteCDN(el));
        }

        document.addEventListener('DOMContentLoaded', () => {
            rewriteContainerCDN();
        });
    </script>

    <script>
        document.addEventListener("alpine:init", () => {
            Alpine.data("socialIcon", ({ link, iconClass, tooltipText, tooltipTextEn }) => ({
                link,
                iconClass,
                tooltipText,
                tooltipTextEn
            }));
        });

        function cardStack () {
            return {
                hoverCard (index) {
                    gsap.to(".card", {
                        y: (i) => (i === index ? -10 : 0),
                        scale: (i) => (i === index ? 1.05 : 1),
                        duration: 0.3,
                    });
                },
                resetCards () {
                    gsap.to(".card", { y: 0, scale: 1, duration: 0.3 });
                },
                selectCard (index) {
                    gsap.to(".card", {
                        y: (i) => (i === index ? -100 : i > index ? 20 : -20),
                        opacity: (i) => (i === index ? 1 : 0.5),
                        scale: (i) => (i === index ? 1.2 : 0.9),
                        zIndex: (i) => (i === index ? 99 : 0),
                        duration: 0.4,
                        ease: "power2.out",
                        onComplete: () => {
                            gsap.to(".card", {
                                y: (i) => (i === index ? -10 : 0),
                                scale: (i) => (i === index ? 1.05 : 1),
                                duration: 0.3,
                            });
                        }
                    })
                }
            };
        }
    </script>

    <script>

        function router () {
            return {
                updateRoute (context) {
                    document.body.className = context.route.slice(1)
                    window.scrollTo(0, 0);
                    this.$nextTick(() => {
                        if (window.updateButterflySpots) {
                            window.updateButterflySpots();
                        }
                    });
                }
            }
        }

        window.addEventListener('hashchange', () => {
            document.body.className = window.location.hash.slice(2);
            window.scrollTo(0, 0);
        })

        document.addEventListener('alpine:init', () => {
            // does browserrouter work in Github Pages?
            window.PineconeRouter.settings.hash = true
            window.PineconeRouter.settings.basePath = '/'
            window.PineconeRouter.settings.templateTargetId = 'app'
            window.PineconeRouter.settings.interceptLinks = true;

            Alpine.data('homeIcon', () => ({
                init () {
                    this.$el.innerHTML = document.getElementById('home-icon').content.cloneNode(true).children[0].outerHTML;
                }
            }))
        })
    </script>

        function withCDN (initFunc) {
            return () => {
                const data = initFunc();
                return {
                    ...data,
                    init () {
                        this.$nextTick(() => rewriteContainerCDN(this.$el));
                    }
                };
            };
        }

        document.addEventListener("alpine:init", () => {
            Alpine.data("initProjects", withCDN(initProjects));

    <script>
        function setTextAnimation (delay, duration, strokeWidth, timingFunction, strokeColor, repeat) {
            let paths = document.querySelectorAll("path");
            let mode = repeat ? 'infinite' : 'forwards'
            for (let i = 0;i < paths.length;i++) {
                const path = paths[i];
                const length = path.getTotalLength();
                path.style["fillOpacity"] = '0.6';
                path.style["stroke-dashoffset"] = `${length}px`;
                path.style["stroke-dasharray"] = `${length}px`;
                path.style["stroke-width"] = `${strokeWidth}px`;
                path.style["stroke"] = `${strokeColor}`;
                path.style["animation"] = `${duration}s svg-text-anim ${mode} ${timingFunction}`;
                path.style["animation-delay"] = `${i * delay}s`;
            }
        }
    </script>
    <script>
        document.addEventListener('alpine:init', () => {
            const canvas = document.getElementById('butterfly');
            let landingSpots = [];
            let isFlyingInput = null;
            let currentSpotIndex = -1;
            let flightLoopTimer = null;
            let lastLandingXFactor = 0.5;

            const riveInstance = new rive.Rive({
                src: 'assets/butterfly.riv',
                canvas: canvas,
                stateMachines: 'StateMachine',
                autoplay: true,
                onLoad: () => {
                    riveInstance.resizeDrawingSurfaceToCanvas();
                    const inputs = riveInstance.stateMachineInputs('StateMachine');
                    isFlyingInput = inputs.find(i => i.name === 'isFlying');
                    gsap.set(canvas, { autoAlpha: 0 });
                    window.updateButterflySpots = updateLandingSpots;
                    updateLandingSpots();

                    canvas.addEventListener('mouseenter', () => {
                        if (isFlyingInput && !isFlyingInput.value) {
                            clearTimeout(flightLoopTimer);
                            flyToNextSpot();
                        }
                    });
                },
            });

            function updateLandingSpots () {
                landingSpots = document.querySelectorAll('.can_stay');
                clearTimeout(flightLoopTimer);
                if (landingSpots.length > 0) {
                    gsap.set(canvas, { autoAlpha: 1 });
                    teleportToSpot(0);
                    flightLoopTimer = setTimeout(flyToNextSpot, 4000);
                } else {
                    gsap.set(canvas, { autoAlpha: 0 });
                }
            }

            function teleportToSpot (index) {
                if (index >= landingSpots.length) return;
                currentSpotIndex = index;
                const spot = landingSpots[index];
                const rect = spot.getBoundingClientRect();
                const targetX = rect.right - rect.width * 0.2;
                const targetY = rect.top - 20;
                gsap.set(canvas, { x: targetX, y: targetY, rotation: 0 });
            }

            function flyToNextSpot () {
                if (!isFlyingInput || landingSpots.length === 0) return;
                let nextSpotIndex;
                do {
                    nextSpotIndex = Math.floor(Math.random() * landingSpots.length);
                } while (landingSpots.length > 1 && nextSpotIndex === currentSpotIndex);

                const targetSpot = landingSpots[nextSpotIndex];
                const rect = targetSpot.getBoundingClientRect();
                lastLandingXFactor = (Math.random() - 0.5) * 0.3;
                const targetX = rect.left + rect.width * lastLandingXFactor;
                const targetY = rect.top - 20;

                const currentX = gsap.getProperty(canvas, "x");
                const currentY = gsap.getProperty(canvas, "y");

                const dx = targetX - currentX;
                const dy = targetY - currentY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                const speed = 120;
                const duration = distance / speed;

                const direction = targetX >= currentX ? -1 : 1;

                isFlyingInput.value = true;
                gsap.to(canvas, {
                    x: targetX,
                    y: targetY,
                    duration: duration,
                    ease: 'power1.inOut',
                    onStart: () => {
                        gsap.to(canvas, { scaleX: direction, duration: 0.5, ease: "power2.out" });
                    },
                    onComplete: () => {
                        isFlyingInput.value = false;
                        currentSpotIndex = nextSpotIndex;

                        const idleTime = Math.random() * 8000 + 8000;
                        flightLoopTimer = setTimeout(flyToNextSpot, idleTime);
                    },
                });
            }
        });
    </script>
